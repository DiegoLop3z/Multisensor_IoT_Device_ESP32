; PlatformIO Project Configuration File
;
;   Práctica 2 - Unidad 2: Sistema Multisensor con Servidor Web ESP32
;   Sensores: GY-SHT41 (I2C 0x44) / DHT11 (GPIO 4), LDR (GPIO 34 ADC1), PIR (GPIO 35)
;   Actuadores: Módulo Relé (GPIO 23), LED RGB (GPIO 25, 26, 27), OLED SSD1306 (I2C 0x3C)
;   Red: Hotspot Wi-Fi en la ESP32 (192.168.4.1) + Servidor Web HTTP (GET / POST)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Evita que el monitor serie mantenga el ESP32 en reset (placas con USB tipo CH9102/CH343, /dev/ttyACM*)
monitor_rts = 0
monitor_dtr = 0
lib_deps =
    adafruit/Adafruit SHT4x Library@^1.0.4
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit BusIO@^1.14.5
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14

